<button [ngClass]="{'pointer-events-none': loading}"
        [type]="type" class="bg-button px-4 py-2 w-full flex items-center rounded-lg gap-1 hover:bg-button-hover
transition-all duration-150 hover:drop-shadow">
  <fa-icon [fixedWidth]=true [icon]="loading ? faSpinner : icon"
           [ngClass]="{'animate-spin': loading}"
           size="lg"></fa-icon>
  {{ text }}
</button>
