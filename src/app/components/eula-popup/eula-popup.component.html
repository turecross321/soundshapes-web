<app-popup (close)="closePopup()" [loading]="eula == null" name="Eula">
  <div *ngIf="eula">
    <p>{{ eula.customText }}</p>
    <br>
    <p>{{ eula.license }}</p>
    <br>
    <p>You can download this server's source code from <a [href]="eula.repositoryUrl"
                                                          class="underline">{{ eula.repositoryUrl }}</a>
    </p>
  </div>
</app-popup>
